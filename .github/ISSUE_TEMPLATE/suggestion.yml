name: Share a suggestion
description: Suggest an improvement or a new idea for GlowPebbles.
title: "[Suggestion]: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make GlowPebbles better. Suggestions are public, so please do not include personal information.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: A short, clear description of your idea.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would it help?
      description: Tell us a little about the need behind the suggestion.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included names, email addresses or other personal information.
          required: true
